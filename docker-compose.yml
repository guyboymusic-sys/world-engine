version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worldengine
      POSTGRES_PASSWORD: worldengine
      POSTGRES_DB: worldengine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldengine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RTMP streaming server ─────────────────────────────────────────────────
  nginx-rtmp:
    image: alfg/nginx-rtmp:latest
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest
      - "8080:80"     # HLS/DASH HTTP
    volumes:
      - ./streaming/nginx-rtmp.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/tmp/hls

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
      - output_data:/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  # ─── Celery workers ───────────────────────────────────────────────────────
  worker-video:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: backend/.env
    runtime: nvidia          # requires nvidia-container-toolkit
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - model_cache:/models
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q video --loglevel=info --concurrency=${VIDEO_WORKER_CONCURRENCY:-1}

  worker-audio:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: backend/.env
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - model_cache:/models
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q audio --loglevel=info --concurrency=${AUDIO_WORKER_CONCURRENCY:-2}

  worker-tts:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: backend/.env
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - model_cache:/models
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q tts --loglevel=info --concurrency=${TTS_WORKER_CONCURRENCY:-2}

  worker-llm:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: backend/.env
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - model_cache:/models
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q llm --loglevel=info --concurrency=${LLM_WORKER_CONCURRENCY:-1}

  # Compositing worker – merges video + audio → stream_input.mp4 (CPU only, no GPU needed)
  worker-composite:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q composite --loglevel=info --concurrency=2

  # Chat + idle workers – lightweight, no GPU needed
  worker-chat-idle:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - output_data:/outputs
    depends_on:
      - redis
      - db
    command: >
      celery -A backend.core.celery_app:celery_app worker
      -Q chat,idle --loglevel=info --concurrency=2

  # Celery Beat – triggers periodic tasks (chat poll + idle check)
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: backend/.env
    depends_on:
      - redis
    command: >
      celery -A backend.core.celery_app:celery_app beat --loglevel=info

  # ─── Celery Flower (monitoring UI at http://localhost:5555) ───────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: >
      celery -A backend.core.celery_app:celery_app flower --port=5555

volumes:
  pgdata:
  hls_data:
  model_cache:
  output_data:
